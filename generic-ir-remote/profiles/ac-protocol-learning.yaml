name: ac-protocol-learning
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: temperatureSetpoint
        version: 1
      - id: fanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
      - id: againmusic09479.acProtocolSelection
        version: 1
      - id: againmusic09479.acLearningSetup
        version: 1
      - id: againmusic09479.irSignalLearning
        version: 1
        config:
          values:
            - key: action.value
              enabledValues:
                - ac_state
            - key: selectAction
              enabledValues:
                - ac_state
    categories:
      - name: AirConditioner
preferences:
  - title: AC temperature unit
    name: acTemperatureUnit
    description: 'Set the unit used by the SmartThings setpoint controls. Learned-state temperatures are entered in Celsius.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        C: Celsius
        F: Fahrenheit
      default: C
  - title: Learn complete AC state
    name: learnAcStateRequest
    description: 'Enter token|on/off|mode|temp-C|fan|vertical-swing|horizontal-swing, e.g. learn-01|on|cool|24|auto|off|off. Use a new token each time, or token|cancel.'
    required: false
    preferenceType: string
    definition:
      stringType: text
      maxLength: 120
