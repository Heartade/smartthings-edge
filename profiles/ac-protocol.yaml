name: ac-protocol
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: temperatureSetpoint
        version: 1
      - id: fanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirConditioner
preferences:
  - title: AC infrared protocol
    name: acProtocol
    description: 'Generated protocols are experimental and require a compatible remote variant; no learning is needed. See the protocol model table in the README. Create an AC protocol with learning child when no variant matches.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        lg_28: LG 28-bit (experimental)
        lg2_28: LG2 28-bit (experimental)
        lg2_akb74955603: LG2 AKB74955603
        toshiba_72_a: Toshiba 72-bit A
        toshiba_72_b: Toshiba 72-bit B
        mitsubishi_144: Mitsubishi Electric 144-bit
        gree_yaw1f: Gree YAW1F
        gree_ybofb: Gree YBOFB
        gree_yx1fsf: Gree YX1FSF
        kelvinator_128: Kelvinator 128-bit
        electra_104: Electra AUX 104-bit
        samsung_ac: Samsung AC 112/168 (experimental)
        haier_72: Haier 72 HSU07-HEA03
        haier_yrw02: Haier 112 YR-W02
        haier_160: Haier 160 KFR-26GW
        haier_176_a: Haier 176 V9014557 A
        haier_176_b: Haier 176 V9014557 B
        carrier_64: Carrier Surrey 64-bit
        tcl112_tac09chsd: TCL Daewoo 112 TAC09CHSD
        tcl112_gz055be1: TCL Teknopoint 112 GZ055BE1
        midea_48: Midea 48-bit (no swing)
        daikin_152: Daikin 152 ARC480A5
      default: lg_28
  - title: AC temperature unit
    name: acTemperatureUnit
    description: 'Set the unit used by the SmartThings setpoint controls. Learned-state temperatures are entered in Celsius.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        C: Celsius
        F: Fahrenheit
      default: C
