name: ac-protocol-learning
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: temperatureSetpoint
        version: 1
      - id: fanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
      - id: againmusic09479.acLearningSetup
        version: 1
      - id: againmusic09479.irSignalLearning
        version: 1
        config:
          values:
            - key: action.value
              enabledValues:
                - ac_state
            - key: selectAction
              enabledValues:
                - ac_state
    categories:
      - name: AirConditioner
preferences:
  - title: AC infrared protocol
    name: acProtocol
    description: 'Generated protocols are experimental and require a compatible remote variant; no learning is needed. See the protocol model table in the README. Use Learn states when no variant matches.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        learned_state: Learn states
        lg_28: LG 28-bit (experimental)
        lg2_28: LG2 28-bit (experimental)
        lg2_akb74955603: LG2 AKB74955603
        toshiba_72_a: Toshiba 72-bit A
        toshiba_72_b: Toshiba 72-bit B
        mitsubishi_144: Mitsubishi Electric 144-bit
        gree_yaw1f: Gree YAW1F
        gree_ybofb: Gree YBOFB
        gree_yx1fsf: Gree YX1FSF
        kelvinator_128: Kelvinator 128-bit
        electra_104: Electra AUX 104-bit
        samsung_ac: Samsung AC 112/168 (experimental)
        haier_72: Haier 72 HSU07-HEA03
        haier_yrw02: Haier 112 YR-W02
        haier_160: Haier 160 KFR-26GW
        haier_176_a: Haier 176 V9014557 A
        haier_176_b: Haier 176 V9014557 B
        carrier_64: Carrier Surrey 64-bit
        tcl112_tac09chsd: TCL Daewoo 112 TAC09CHSD
        tcl112_gz055be1: TCL Teknopoint 112 GZ055BE1
        midea_48: Midea 48-bit (no swing)
        daikin_152: Daikin 152 ARC480A5
        irac_airton: AIRTON
        irac_airwell: AIRWELL
        irac_amcor: AMCOR
        irac_argo: ARGO
        irac_bosch144: BOSCH144
        irac_carrier_ac64: CARRIER_AC64
        irac_coolix: COOLIX
        irac_corona_ac: CORONA_AC
        irac_daikin: DAIKIN
        irac_daikin128: DAIKIN128
        irac_daikin152: DAIKIN152
        irac_daikin160: DAIKIN160
        irac_daikin176: DAIKIN176
        irac_daikin2: DAIKIN2
        irac_daikin216: DAIKIN216
        irac_daikin312: DAIKIN312
        irac_daikin64: DAIKIN64
        irac_delonghi_ac: DELONGHI_AC
        irac_ecoclim: ECOCLIM
        irac_electra_ac: ELECTRA_AC
        irac_eurom: EUROM
        irac_fujitsu_ac: FUJITSU_AC
        irac_goodweather: GOODWEATHER
        irac_gree: GREE
        irac_haier_ac: HAIER_AC
        irac_haier_ac160: HAIER_AC160
        irac_haier_ac176: HAIER_AC176
        irac_haier_ac_yrw02: HAIER_AC_YRW02
        irac_hitachi_ac: HITACHI_AC
        irac_hitachi_ac1: HITACHI_AC1
        irac_hitachi_ac264: HITACHI_AC264
        irac_hitachi_ac296: HITACHI_AC296
        irac_hitachi_ac344: HITACHI_AC344
        irac_hitachi_ac424: HITACHI_AC424
        irac_kelon: KELON
        irac_kelvinator: KELVINATOR
        irac_lg: LG
        irac_lg2: LG2
        irac_midea: MIDEA
        irac_mirage: MIRAGE
        irac_mitsubishi112: MITSUBISHI112
        irac_mitsubishi136: MITSUBISHI136
        irac_mitsubishi_ac: MITSUBISHI_AC
        irac_mitsubishi_heavy_152: MITSUBISHI_HEAVY_152
        irac_mitsubishi_heavy_88: MITSUBISHI_HEAVY_88
        irac_neoclima: NEOCLIMA
        irac_panasonic_ac: PANASONIC_AC
        irac_panasonic_ac32: PANASONIC_AC32
        irac_rhoss: RHOSS
        irac_samsung_ac: SAMSUNG_AC
        irac_sanyo_ac: SANYO_AC
        irac_sanyo_ac88: SANYO_AC88
        irac_sharp_ac: SHARP_AC
        irac_tcl112ac: TCL112AC
        irac_technibel_ac: TECHNIBEL_AC
        irac_teco: TECO
        irac_teknopoint: TEKNOPOINT
        irac_toshiba_ac: TOSHIBA_AC
        irac_transcold: TRANSCOLD
        irac_trotec: TROTEC
        irac_trotec_3550: TROTEC_3550
        irac_truma: TRUMA
        irac_vestel_ac: VESTEL_AC
        irac_voltas: VOLTAS
        irac_whirlpool_ac: WHIRLPOOL_AC
        irac_york: YORK
      default: learned_state
  - title: AC temperature unit
    name: acTemperatureUnit
    description: 'Set the unit used by the SmartThings setpoint controls. Learned-state temperatures are entered in Celsius.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        C: Celsius
        F: Fahrenheit
      default: C
  - title: Learn complete AC state
    name: learnAcStateRequest
    description: 'Enter token|on/off|mode|temp-C|fan|vertical-swing|horizontal-swing, e.g. learn-01|on|cool|24|auto|off|off. Use a new token each time, or token|cancel.'
    required: false
    preferenceType: string
    definition:
      stringType: text
      maxLength: 120
  - title: AC protocol model
    name: acModel
    description: 'For catalog protocols: 0 selects the default model. See docs/ac-catalog.md for model numbers. Legacy protocols ignore this setting.'
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 6
      default: 0
