        irac_hitachi_ac296: IRac HITACHI_AC296
        irac_hitachi_ac344: IRac HITACHI_AC344
        irac_hitachi_ac424: IRac HITACHI_AC424
        irac_kelon: IRac KELON
        irac_kelvinator: IRac KELVINATOR
        irac_lg: IRac LG
