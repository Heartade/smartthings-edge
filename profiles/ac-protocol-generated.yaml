        irac_daikin216: IRac DAIKIN216
        irac_daikin312: IRac DAIKIN312
        irac_daikin64: IRac DAIKIN64
        irac_delonghi_ac: IRac DELONGHI_AC
        irac_ecoclim: IRac ECOCLIM
