      default: learned_state
  - title: AC temperature unit
    name: acTemperatureUnit
    description: 'Set the unit used by the SmartThings setpoint controls. Learned-state temperatures are entered in Celsius.'
    required: false
    preferenceType: enumeration
    definition:
      options:
        C: Celsius
        F: Fahrenheit
      default: C
  - title: AC protocol model
    name: acModel
    description: 'For IRac protocols: 0 selects the default model. See docs/ac-catalog.md for model numbers. Legacy protocols ignore this setting.'
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 6
      default: 0
